<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vanik Edge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vanik-ui.css">
  <link rel="stylesheet" href="mvp.css">
</head>
<body>
  <div id="root"><p class="boot" style="font:14px/1.5 system-ui,sans-serif;color:#6b7280;text-align:center;margin-top:28vh">Opening Vanik Edge…</p></div>
  <script src="vanik-ui.js"></script>
  <script>
    // Preview build: the server runs in this browser. Send API calls to it and wait until it is in control.
    const BASE = new URL('./', location).pathname.replace(/\/$/, ''), realFetch = window.fetch.bind(window);
    window.fetch = (u, o) => realFetch(typeof u === 'string' && (u.startsWith('/api/') || u.startsWith('/gateway/')) ? BASE + u : u, o);
    (async () => {
      if (!('serviceWorker' in navigator)) { document.getElementById('root').textContent = 'This preview needs a browser with service workers.'; return; }
      const say = t => { const b = document.querySelector('#root .boot'); if (b) b.textContent = t; };
      say('Starting the preview. The first time takes a few seconds.');
      const BUILD = '20261013123227', changed = () => new Promise(r => { navigator.serviceWorker.addEventListener('controllerchange', r, { once: true }); setTimeout(r, 8000); });
      const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
      await navigator.serviceWorker.ready;
      if (!navigator.serviceWorker.controller) await changed();
      // Someone who has been here before may still have the worker of an older build, which would answer this page
      // with the older server. Ask the worker which build it is; if it is not this one, bring the new one in and start again.
      const theirs = await realFetch(BASE + '/__build', { cache: 'no-store' }).then(r => (r.ok ? r.text() : '')).catch(() => '');
      if (theirs !== BUILD && sessionStorage.getItem('vnk.build') !== BUILD) {
        sessionStorage.setItem('vnk.build', BUILD);
        say('Getting the latest version…');
        await reg.update().catch(() => {});
        for (let i = 0; i < 20; i++) { // the new worker may already be in charge; ask until it answers, for ten seconds at most
          const now = await realFetch(BASE + '/__build', { cache: 'no-store' }).then(r => (r.ok ? r.text() : '')).catch(() => '');
          if (now === BUILD) break;
          await new Promise(r => setTimeout(r, 500));
        }
        return location.reload();
      }
      realFetch(BASE + '/api/accounts').catch(() => {}); // wake the in-browser server while the screens load
      import('./app.js?b=' + BUILD).catch(e => { say('The preview could not start: ' + e.message + '. Reload the page.'); });
    })();
  </script>
</body>
</html>
